# 핑거·성호전자 DART 공시 목록을 받아 data/disclosures.json에 저장(핑거 IR 대시보드 '최근 공시'용).
# 시간은 UTC 기준. KST = UTC+9. 정각은 GitHub가 붐벼 늦어지므로 7분·37분에 실행.
name: DART 공시 받기
on:
  schedule:
    - cron: '7,37 22-23 * * 0-4'  # KST 월~금 07:07~08:37
    - cron: '7,37 0-10 * * 1-5'   # KST 월~금 09:07~19:37
    - cron: '17 13 * * *'         # KST 매일 22:17 (늦은 공시·주말 확인)
  workflow_dispatch: {}           # Actions 화면에서 'Run workflow'로 바로 실행
permissions:
  contents: write
concurrency:
  group: dart-disclosures
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: DART에서 공시 목록 받기
        run: node scripts/fetch-dart.mjs
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - name: 바뀌었으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/disclosures.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "DART 공시 갱신"
          git push
